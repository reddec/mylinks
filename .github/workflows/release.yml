name: release

# Tag v1.1.0 → run the checks, build a signed APK, publish it as a GitHub release.
# Nothing else triggers this workflow: branch pushes and pull requests run nothing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is derived from the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The runner image already ships an Android SDK, so no third-party setup action is needed.
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK"
            ls -R "$SDK" | head -40 || true
            exit 1
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" "$SDK/build-tools"

      # The keystore never lives in the repository: it arrives base64-encoded from secrets and is
      # written straight into the (gitignored) paths the Gradle signing config reads.
      - name: Unpack signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — see README «Releasing»"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Version from tag
        run: |
          set -euo pipefail
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Build signed APK
        run: >-
          ./gradlew :app:assembleRelease
          -PversionName="$VERSION"
          -PversionCode="$VERSION_CODE"

      - name: Collect artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          mv app/build/outputs/apk/release/app-release.apk "dist/mylinks-${VERSION}.apk"
          cd dist && sha256sum "mylinks-${VERSION}.apk" > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Verify the artifact matches the tag
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            "dist/mylinks-${VERSION}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging \
            "dist/mylinks-${VERSION}.apk" | grep -E "^package:" | tee /tmp/badging.txt
          grep -q "versionName='${VERSION}'" /tmp/badging.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "MyLinks ${VERSION}" \
            --generate-notes \
            "dist/mylinks-${VERSION}.apk" dist/SHA256SUMS.txt
